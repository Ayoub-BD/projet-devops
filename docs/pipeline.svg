<svg xmlns="http://www.w3.org/2000/svg" width="880" height="850" viewBox="0 0 880 850" role="img" aria-labelledby="t d" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif">
<title id="t">Pipeline CI/CD</title>
<desc id="d">À chaque push sur main : les jobs tests et secrets s'exécutent en parallèle, puis le job build construit, scanne avec Trivy et publie l'image, puis le job deploy déploie sur la VM par SSH.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4A47"/></marker></defs>
<rect width="880" height="850" rx="14" fill="#FFFFFF"/>
<rect x="330" y="20" width="220" height="62" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
<text x="440.0" y="47.5" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="middle">Push sur main</text>
<text x="440.0" y="65.5" font-size="12.5" fill="#5F5E5A" text-anchor="middle">déclenche le workflow</text>
<rect x="40" y="26" width="16" height="16" rx="4" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.4"/>
<text x="64" y="39" font-size="12" fill="#5F5E5A" text-anchor="start">porte de sécurité bloquante</text>
<text x="40" y="62" font-size="12" fill="#5F5E5A" text-anchor="start">un échec arrête les étapes suivantes</text>
<rect x="40" y="125" width="800" height="155" rx="18" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="64" y="155" font-size="16" font-weight="600" fill="#085041">Vérifications</text>
<text x="816" y="155" font-size="12.5" fill="#5F5E5A" text-anchor="end" font-style="italic">en parallèle</text>
<rect x="65" y="170" width="345" height="80" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
<text x="237.5" y="198.0" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="middle">tests</text>
<text x="237.5" y="216.0" font-size="12.5" fill="#5F5E5A" text-anchor="middle">pytest sur l'application</text>
<text x="237.5" y="233.0" font-size="12.5" fill="#5F5E5A" text-anchor="middle">bloque si un test échoue</text>
<rect x="470" y="170" width="345" height="80" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.4"/>
<text x="642.5" y="198.0" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="middle">secrets</text>
<text x="642.5" y="216.0" font-size="12.5" fill="#5F5E5A" text-anchor="middle">Gitleaks sur tout l'historique Git</text>
<text x="642.5" y="233.0" font-size="12.5" fill="#5F5E5A" text-anchor="middle">bloque si un secret est détecté</text>
<rect x="40" y="340" width="800" height="165" rx="18" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="64" y="370" font-size="16" font-weight="600" fill="#3C3489">Build et publication</text>
<text x="816" y="370" font-size="12.5" fill="#5F5E5A" text-anchor="end" font-style="italic">job build</text>
<rect x="65" y="395" width="220" height="80" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
<text x="175.0" y="423.0" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="middle">docker build</text>
<text x="175.0" y="441.0" font-size="12.5" fill="#5F5E5A" text-anchor="middle">tags : SHA du commit</text>
<text x="175.0" y="458.0" font-size="12.5" fill="#5F5E5A" text-anchor="middle">et latest</text>
<rect x="330" y="395" width="220" height="80" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.4"/>
<text x="440.0" y="423.0" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="middle">Trivy</text>
<text x="440.0" y="441.0" font-size="12.5" fill="#5F5E5A" text-anchor="middle">scan de l'image</text>
<text x="440.0" y="458.0" font-size="12.5" fill="#5F5E5A" text-anchor="middle">bloque si CRITICAL ou HIGH</text>
<rect x="595" y="395" width="220" height="80" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
<text x="705.0" y="431.5" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="middle">docker push</text>
<text x="705.0" y="449.5" font-size="12.5" fill="#5F5E5A" text-anchor="middle">registre d'images GHCR</text>
<rect x="40" y="560" width="800" height="165" rx="18" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="64" y="590" font-size="16" font-weight="600" fill="#0C447C">Déploiement</text>
<text x="816" y="590" font-size="12.5" fill="#5F5E5A" text-anchor="end" font-style="italic">job deploy</text>
<rect x="65" y="615" width="345" height="80" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
<text x="237.5" y="643.0" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="middle">Connexion SSH</text>
<text x="237.5" y="661.0" font-size="12.5" fill="#5F5E5A" text-anchor="middle">clé privée stockée en secret GitHub</text>
<text x="237.5" y="678.0" font-size="12.5" fill="#5F5E5A" text-anchor="middle">vers la VM Azure</text>
<rect x="470" y="615" width="345" height="80" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
<text x="642.5" y="643.0" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="middle">deploy.sh</text>
<text x="642.5" y="661.0" font-size="12.5" fill="#5F5E5A" text-anchor="middle">pull, remplacement du conteneur</text>
<text x="642.5" y="678.0" font-size="12.5" fill="#5F5E5A" text-anchor="middle">health check par curl</text>
<rect x="330" y="765" width="220" height="62" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
<text x="440.0" y="792.5" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="middle">Version en ligne</text>
<text x="440.0" y="810.5" font-size="12.5" fill="#5F5E5A" text-anchor="middle">site servi sur le port 80</text>
<polyline points="440,82 440,102 237,102 237,170" fill="none" stroke="#4A4A47" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<polyline points="440,102 642,102 642,170" fill="none" stroke="#4A4A47" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<polyline points="237,250 237,312 440,312 440,340" fill="none" stroke="#4A4A47" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<polyline points="642,250 642,312 440,312" fill="none" stroke="#4A4A47" stroke-width="1.6" stroke-linejoin="round"/>
<text x="452" y="332" font-size="12.5" fill="#3F3F3C" text-anchor="start" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">les deux réussissent</text>
<polyline points="285,435 330,435" fill="none" stroke="#4A4A47" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<polyline points="550,435 595,435" fill="none" stroke="#4A4A47" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<polyline points="440,505 440,560" fill="none" stroke="#4A4A47" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="452" y="538" font-size="12.5" fill="#3F3F3C" text-anchor="start" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">image publiée</text>
<polyline points="410,655 470,655" fill="none" stroke="#4A4A47" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<polyline points="440,725 440,765" fill="none" stroke="#4A4A47" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="452" y="750" font-size="12.5" fill="#3F3F3C" text-anchor="start" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">health check réussi</text>
</svg>
