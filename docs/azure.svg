<svg xmlns="http://www.w3.org/2000/svg" width="880" height="885" viewBox="0 0 880 885" role="img" aria-labelledby="t d" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif">
<title id="t">Infrastructure Azure</title>
<desc id="d">Internet atteint une IP publique, filtrée par un Network Security Group, puis l'interface réseau d'une VM Ubuntu dans un réseau virtuel. Sur la VM, UFW filtre le trafic avant le conteneur Docker Flask.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4A47"/></marker></defs>
<rect width="880" height="885" rx="14" fill="#FFFFFF"/>
<rect x="325" y="20" width="230" height="62" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
<text x="440.0" y="47.5" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="middle">Internet</text>
<text x="440.0" y="65.5" font-size="12.5" fill="#5F5E5A" text-anchor="middle">visiteurs et déploiement CI</text>
<rect x="40" y="112" width="800" height="748" rx="18" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="64" y="142" font-size="16" font-weight="600" fill="#085041">Resource group · rg-projet-devops-tf</text>
<text x="816" y="142" font-size="12.5" fill="#5F5E5A" text-anchor="end" font-style="italic">créé par Terraform</text>
<rect x="325" y="165" width="230" height="62" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
<text x="440.0" y="192.5" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="middle">IP publique</text>
<text x="440.0" y="210.5" font-size="12.5" fill="#5F5E5A" text-anchor="middle">statique · SKU Standard</text>
<rect x="280" y="257" width="320" height="80" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.4"/>
<text x="440.0" y="285.0" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="middle">Network Security Group</text>
<text x="440.0" y="303.0" font-size="12.5" fill="#5F5E5A" text-anchor="middle">autorise : TCP 22 (SSH) et TCP 80 (HTTP)</text>
<text x="440.0" y="320.0" font-size="12.5" fill="#5F5E5A" text-anchor="middle">refuse : tout le reste</text>
<rect x="65" y="367" width="750" height="463" rx="18" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="89" y="397" font-size="16" font-weight="600" fill="#3C3489">Réseau virtuel 10.0.0.0/16</text>
<text x="791" y="397" font-size="12.5" fill="#5F5E5A" text-anchor="end" font-style="italic">sous-réseau 10.0.1.0/24</text>
<circle cx="440" cy="452" r="27" fill="#F1EFE8" stroke="#2C2C2A" stroke-width="1.4"/>
<line x1="440" y1="452" x2="453" y2="452" stroke="#2C2C2A" stroke-width="1.5"/>
<path d="M453,452 L448.0,455.5 L448.0,448.5 Z" fill="#2C2C2A"/>
<line x1="440" y1="452" x2="427" y2="452" stroke="#2C2C2A" stroke-width="1.5"/>
<path d="M427,452 L432.0,448.5 L432.0,455.5 Z" fill="#2C2C2A"/>
<line x1="440" y1="452" x2="440" y2="465" stroke="#2C2C2A" stroke-width="1.5"/>
<path d="M440,465 L436.5,460.0 L443.5,460.0 Z" fill="#2C2C2A"/>
<line x1="440" y1="452" x2="440" y2="439" stroke="#2C2C2A" stroke-width="1.5"/>
<path d="M440,439 L443.5,444.0 L436.5,444.0 Z" fill="#2C2C2A"/>
<text x="481" y="450" font-size="16" font-weight="600" fill="#2C2C2A">Interface réseau</text>
<text x="481" y="469" font-size="12.5" fill="#5F5E5A">reliée à l'IP publique et au NSG</text>
<rect x="90" y="507" width="700" height="293" rx="18" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="114" y="537" font-size="16" font-weight="600" fill="#085041">VM Ubuntu Server 24.04 LTS</text>
<text x="114" y="556" font-size="12.5" fill="#5F5E5A">Standard_B2ats_v2 · disque 64 Go Premium_LRS</text>
<text x="766" y="537" font-size="12.5" fill="#5F5E5A" text-anchor="end" font-style="italic">configurée par Ansible</text>
<rect x="315" y="582" width="250" height="70" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.4"/>
<text x="440.0" y="605.0" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="middle">UFW</text>
<text x="440.0" y="623.0" font-size="12.5" fill="#5F5E5A" text-anchor="middle">refus entrant par défaut</text>
<text x="440.0" y="640.0" font-size="12.5" fill="#5F5E5A" text-anchor="middle">autorise SSH (22) et HTTP (80)</text>
<rect x="315" y="692" width="250" height="80" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
<text x="440.0" y="720.0" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="middle">Docker · conteneur Flask</text>
<text x="440.0" y="738.0" font-size="12.5" fill="#5F5E5A" text-anchor="middle">port 80 de la VM vers 5000</text>
<text x="440.0" y="755.0" font-size="12.5" fill="#5F5E5A" text-anchor="middle">redémarrage automatique</text>
<polyline points="440,82 440,165" fill="none" stroke="#4A4A47" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="452" y="130" font-size="12.5" fill="#3F3F3C" text-anchor="start" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">TCP 22 et 80</text>
<polyline points="440,227 440,257" fill="none" stroke="#4A4A47" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<polyline points="440,337 440,425" fill="none" stroke="#4A4A47" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
<polyline points="440,479 440,582" fill="none" stroke="#4A4A47" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>
